<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clone Split Center Top</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
/* เพิ่มฟิลเตอร์เพื่อให้กล้องดูสดใส มีชีวิตชีวา สีผิวอมชมพูเหมือนอนิเมะ */
video, canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  filter: saturate(1.2) contrast(1.1) brightness(1.03);
  transition: filter 0.5s ease;
  pointer-events: none; /* ไม่ให้บังการคลิกเมนู */
}
/* เอฟเฟกต์ Vignette เกรดภาพยนต์ เพิ่มมิติความลึกให้กล้อง */
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
  pointer-events: none;
  z-index: 5;
}
/* ดีไซน์ปุ่มแสดงสถานะให้ดูมินิมอล โมเดิร์น แบบกระจกฝ้า (Glassmorphism) */
#log {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #00ffaa;
  background: rgba(10, 15, 30, 0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 255, 170, 0.25);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  font-family: 'Fira Code', monospace;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  z-index: 20;
}

/* ===== เมนูเลือกท่าไม้ตาย (Jutsu Menu) ===== */
#menu {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 30;
  padding: 12px;
  background: rgba(8, 12, 24, 0.65);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.jutsu-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 108px;
  padding: 12px 8px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  color: #ddd;
  cursor: pointer;
  font-family: inherit;
  transition: transform .22s cubic-bezier(.2,.8,.2,1),
              background .22s ease, border-color .22s ease,
              box-shadow .22s ease, color .22s ease;
  user-select: none;
}
.jutsu-card:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.22);
}
.jutsu-card.active {
  background: linear-gradient(135deg, rgba(0,200,255,0.28), rgba(255,100,0,0.18));
  border-color: rgba(0,240,255,0.65);
  box-shadow: 0 0 24px rgba(0,200,255,0.5),
              inset 0 0 12px rgba(255,255,255,0.1);
  color: #fff;
}
.jutsu-icon {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 6px;
  filter: drop-shadow(0 0 6px currentColor);
}
.jutsu-name {
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.4px;
}
.jutsu-name-jp {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 2px;
}
.jutsu-desc {
  font-size: 10px;
  opacity: 0.65;
  margin-top: 5px;
  text-align: center;
  line-height: 1.3;
}
/* แถบโลโก้/ชื่อท่าด้านบนกลาง */
#title {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 25;
  color: #fff;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: 2px;
  text-shadow: 0 0 18px var(--jutsu-color, #00f0ff),
               0 2px 6px rgba(0,0,0,0.6);
  background: rgba(10,15,30,0.55);
  backdrop-filter: blur(10px);
  padding: 10px 22px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: text-shadow .3s ease;
}
#title .jp { font-size: 12px; opacity: 0.8; margin-left: 8px; font-weight: 500; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="log"></div>

<div id="title">影分身の術<span class="jp">SHADOW CLONE</span></div>

<div id="menu">
  <button class="jutsu-card active" data-jutsu="shadowClone" style="color:#ff8844">
    <span class="jutsu-icon">🥷</span>
    <span class="jutsu-name">Shadow Clone</span>
    <span class="jutsu-name-jp">影分身の術</span>
    <span class="jutsu-desc">ประกบนิ้วชี้ 2 มือ</span>
  </button>
  <button class="jutsu-card" data-jutsu="chidori" style="color:#66ddff">
    <span class="jutsu-icon">⚡</span>
    <span class="jutsu-name">Chidori</span>
    <span class="jutsu-name-jp">千鳥</span>
    <span class="jutsu-desc">ยกมือเดียวขึ้น</span>
  </button>
  <button class="jutsu-card" data-jutsu="rasengan" style="color:#88ffdd">
    <span class="jutsu-icon">🌀</span>
    <span class="jutsu-name">Rasengan</span>
    <span class="jutsu-name-jp">螺旋丸</span>
    <span class="jutsu-desc">เปิดฝ่ามือออก</span>
  </button>
  <button class="jutsu-card" data-jutsu="fireball" style="color:#ff7733">
    <span class="jutsu-icon">🔥</span>
    <span class="jutsu-name">Fireball</span>
    <span class="jutsu-name-jp">豪火球の術</span>
    <span class="jutsu-desc">ทำมือเป็นกระบอก</span>
  </button>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const logDiv=document.getElementById("log");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let mode="idle";
let frozenBackground=null;
let personImage=null;
let smoke=[];
let finished=false;

let cloneCount=7;     // ต่อข้าง
let backCount=3;      // ด้านหลัง
let revealIndex=0;
let revealSpeed=4;
let frameCounter=0;
let safeSpacing=60;

// ===== ระบบเอฟเฟกต์: เร็ว + ลื่น + เท่ห์ =====
let lastTime = performance.now();
let dt = 0;
let revealProgress = 0;       // float — ทำให้ pop-in ของแต่ละโคลนสมูธทุก refresh rate
const revealRate = 14;        // โคลน/วินาที
let chakraCharge = 0;         // 0..1 พลังจักระสะสมที่กลางสองมือ
let flashAlpha = 0;           // แฟลชขาวตอนทริกเกอร์
let shakeTime = 0;
const shakeMax = 0.35;

// ===== JUTSU REGISTRY =====
const JUTSU = {
  shadowClone: {
    title: "影分身の術", sub: "SHADOW CLONE",
    color: "#ff8844", glow: "#ffaa44"
  },
  chidori: {
    title: "千鳥", sub: "CHIDORI",
    color: "#66ddff", glow: "#00aaff"
  },
  rasengan: {
    title: "螺旋丸", sub: "RASENGAN",
    color: "#88ffdd", glow: "#00ffcc"
  },
  fireball: {
    title: "豪火球の術", sub: "FIREBALL",
    color: "#ff7733", glow: "#ff5500"
  }
};
let currentJutsu = "shadowClone";

// state ของเอฟเฟกต์ต่อเนื่อง
let rasenganAngle = 0;
let fireParticles = [];
let chidoriPulse = 0;

// pre-rendered smoke sprite — เร็วกว่า arc+fill หลายเท่า ลดงาน GPU
const smokeSprite = document.createElement("canvas");
smokeSprite.width = 128; smokeSprite.height = 128;
(()=>{
  const sc = smokeSprite.getContext("2d");
  const g = sc.createRadialGradient(64,64,2, 64,64,64);
  g.addColorStop(0,   "rgba(245,245,245,1)");
  g.addColorStop(0.4, "rgba(200,200,200,0.55)");
  g.addColorStop(1,   "rgba(160,160,160,0)");
  sc.fillStyle = g;
  sc.fillRect(0,0,128,128);
})();

// ดึงข้อมูลกล้องแบบทนทาน (มีระบบ Fallback เพื่อป้องกันจอมืด)
function startCamera() {
  const hdConstraints = {
    video: {
      width: { ideal: 1280 },
      height: { ideal: 720 },
      facingMode: "user"
    }
  };

  navigator.mediaDevices.getUserMedia(hdConstraints)
    .then(s => {
      video.srcObject = s;
    })
    .catch(err => {
      console.warn("HD Camera constraints failed, trying fallback...", err);
      // Fallback: ใช้กล้องพื้นฐานอะไรก็ได้ที่เชื่อมต่ออยู่
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => {
          video.srcObject = s;
        })
        .catch(e => {
          console.error("All camera initialization attempts failed: ", e);
          alert("ไม่สามารถเปิดใช้งานกล้องได้ กรุณาตรวจสอบสิทธิ์การเข้าถึงกล้องของเบราว์เซอร์");
        });
    });
}
startCamera();

// ===== HANDS =====
const hands=new Hands({
 locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
 maxNumHands:2,
 modelComplexity:0,
 minDetectionConfidence:0.7,
 minTrackingConfidence:0.7
});

hands.onResults(res=>{

 if(mode==="idle"){
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
 }

  if(res.multiHandLandmarks && mode==="idle"){
    // วาด skeleton มือเป็นเส้นจักระบางๆ (สีตามท่าที่เลือก)
    const jColor = JUTSU[currentJutsu].glow;
    ctx.save();
    ctx.shadowColor = jColor;
    ctx.shadowBlur = 14;
    for(const landmarks of res.multiHandLandmarks){
      drawConnectors(ctx,landmarks,HAND_CONNECTIONS,
        {color:`${jColor}cc`,lineWidth:3});
      drawLandmarks(ctx,landmarks,
        {color:"#ff6600",lineWidth:2});
    }
    ctx.restore();

    // แตกสาขาตามท่าที่เลือก
    if(currentJutsu==="shadowClone"){
      handleShadowClone(res.multiHandLandmarks);
    } else if(currentJutsu==="chidori"){
      for(const lm of res.multiHandLandmarks) drawChidori(lm);
    } else if(currentJutsu==="rasengan"){
      rasenganAngle += dt*8;
      for(const lm of res.multiHandLandmarks) drawRasengan(lm);
    } else if(currentJutsu==="fireball"){
      for(const lm of res.multiHandLandmarks) drawFireball(lm);
    }
  }

  updateLog();
});

// ===== Shadow Clone trigger (เดิม) =====
function handleShadowClone(landmarksList){
  if(landmarksList.length===2){
    const h1=landmarksList[0][8];
    const h2=landmarksList[1][8];
    const dx=h1.x-h2.x;
    const dy=h1.y-h2.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<0.18){
      chakraCharge = Math.min(1, chakraCharge + 0.08);
      const mx = (h1.x + h2.x)/2 * canvas.width;
      const my = (h1.y + h2.y)/2 * canvas.height;
      const now = performance.now();
      const r = 30 + chakraCharge*55 + Math.sin(now*0.012)*6;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const grad = ctx.createRadialGradient(mx,my,0, mx,my,r);
      grad.addColorStop(0,   `rgba(220,250,255,${0.9*chakraCharge})`);
      grad.addColorStop(0.5, `rgba(0,200,255,${0.5*chakraCharge})`);
      grad.addColorStop(1,   "rgba(0,80,200,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.fill();

      ctx.strokeStyle = `rgba(180,240,255,${0.75*chakraCharge})`;
      ctx.lineWidth = 1.5;
      for(let i=0;i<6;i++){
        const a = Math.random()*Math.PI*2;
        const r1 = r*0.65 + Math.random()*r*0.35;
        const r2 = r1 + 8 + Math.random()*14;
        ctx.beginPath();
        ctx.moveTo(mx+Math.cos(a)*r1, my+Math.sin(a)*r1);
        ctx.lineTo(mx+Math.cos(a)*r2, my+Math.sin(a)*r2);
        ctx.stroke();
      }
      ctx.restore();

      if(dist<0.05 && chakraCharge>=0.75){
        triggerCapture();
      }
    } else {
      chakraCharge *= 0.85;
    }
  } else {
    chakraCharge *= 0.85;
  }
}

// ===== Helpers =====
function palmCenter(lm){
  const pts=[lm[0],lm[5],lm[9],lm[13],lm[17]];
  let x=0,y=0;
  for(const p of pts){x+=p.x;y+=p.y;}
  return {x:x/pts.length*canvas.width, y:y/pts.length*canvas.height};
}
function handSize(lm){
  const dx=(lm[0].x-lm[9].x)*canvas.width;
  const dy=(lm[0].y-lm[9].y)*canvas.height;
  return Math.sqrt(dx*dx+dy*dy);
}

// ===== Chidori: ฟ้าผ่ารอบฝ่ามือ =====
function drawChidori(lm){
  const c=palmCenter(lm);
  const sz=handSize(lm);
  const r=sz*1.6;
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  const grad=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
  grad.addColorStop(0,   "rgba(230,245,255,0.95)");
  grad.addColorStop(0.4, "rgba(80,180,255,0.55)");
  grad.addColorStop(1,   "rgba(0,80,200,0)");
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle="rgba(230,245,255,0.95)";
  ctx.lineWidth=2;
  ctx.shadowColor="#00aaff";
  ctx.shadowBlur=14;
  for(let b=0;b<10;b++){
    const a=Math.random()*Math.PI*2;
    let x=c.x, y=c.y;
    ctx.beginPath(); ctx.moveTo(x,y);
    const segs=5+Math.floor(Math.random()*3);
    for(let s=0;s<segs;s++){
      const step=r*0.22;
      x+=Math.cos(a)*step+(Math.random()-0.5)*18;
      y+=Math.sin(a)*step+(Math.random()-0.5)*18;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ===== Rasengan: ลูกบอลพลังหมุน =====
function drawRasengan(lm){
  const c=palmCenter(lm);
  const sz=handSize(lm);
  const r=sz*1.35;
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  const grad=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
  grad.addColorStop(0,   "rgba(240,255,255,0.95)");
  grad.addColorStop(0.3, "rgba(100,220,255,0.7)");
  grad.addColorStop(0.7, "rgba(0,150,255,0.35)");
  grad.addColorStop(1,   "rgba(0,40,140,0)");
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle="rgba(190,245,255,0.85)";
  ctx.lineWidth=2;
  ctx.shadowColor="#00ddff";
  ctx.shadowBlur=10;
  for(let i=0;i<3;i++){
    const phase=rasenganAngle+i*Math.PI*2/3;
    ctx.beginPath();
    for(let t=0;t<=Math.PI*2+0.01;t+=0.12){
      const rr=r*(0.45+0.5*Math.abs(Math.cos(t+phase)));
      const x=c.x+Math.cos(t)*rr;
      const y=c.y+Math.sin(t)*rr*0.45+Math.sin(t*2+phase)*r*0.12;
      if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ===== Fireball: ลูกไฟพ่นประกาย =====
function drawFireball(lm){
  const c=palmCenter(lm);
  const sz=handSize(lm);
  const r=sz*1.2;

  // ปล่อย particles
  for(let i=0;i<5;i++){
    fireParticles.push({
      x:c.x+(Math.random()-0.5)*r*0.8,
      y:c.y+(Math.random()-0.5)*r*0.8,
      vx:(Math.random()-0.5)*3,
      vy:-2-Math.random()*3,
      life:1,
      size:12+Math.random()*22
    });
  }

  ctx.save();
  ctx.globalCompositeOperation="lighter";
  const grad=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
  grad.addColorStop(0,   "rgba(255,250,180,0.95)");
  grad.addColorStop(0.4, "rgba(255,140,30,0.75)");
  grad.addColorStop(1,   "rgba(200,30,0,0)");
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function updateFireParticles(){
  if(fireParticles.length===0) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(let i=fireParticles.length-1;i>=0;i--){
    const p=fireParticles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.97; p.vy*=0.97;
    p.life-=0.028;
    if(p.life<=0){ fireParticles.splice(i,1); continue; }
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
    g.addColorStop(0,   `rgba(255,210,90,${p.life*0.85})`);
    g.addColorStop(0.5, `rgba(255,90,10,${p.life*0.55})`);
    g.addColorStop(1,   "rgba(80,0,0,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ===== SEGMENT =====
const segmenter=new SelfieSegmentation({
 locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
});
segmenter.setOptions({modelSelection:1});

segmenter.onResults(results=>{

 if(mode!=="capture") return;

 frozenBackground=document.createElement("canvas");
 frozenBackground.width=canvas.width;
 frozenBackground.height=canvas.height;
 frozenBackground.getContext("2d")
  .drawImage(video,0,0,canvas.width,canvas.height);

 const maskCanvas=document.createElement("canvas");
 maskCanvas.width=canvas.width;
 maskCanvas.height=canvas.height;
 maskCanvas.getContext("2d")
  .drawImage(results.segmentationMask,
    0,0,canvas.width,canvas.height);

 const temp=document.createElement("canvas");
 temp.width=canvas.width;
 temp.height=canvas.height;
 const t=temp.getContext("2d");

 t.drawImage(video,0,0,temp.width,temp.height);
 t.globalCompositeOperation="destination-in";
 t.drawImage(maskCanvas,0,0,temp.width,temp.height);

 personImage=temp;

 safeSpacing=(canvas.width/2)/(cloneCount+1);

 mode="split";
});

// ===== TRIGGER =====
function triggerCapture(){

 if(finished) return;

 mode="capture";
 flashAlpha = 1;
 shakeTime = shakeMax;
 chakraCharge = 0;

 // ควันระเบิดออกจากศูนย์กลางแบบ radial — ดูมีพลังกว่าสุ่มแบบเดิม
 for(let i=0;i<80;i++){
   const a = Math.random()*Math.PI*2;
   const sp = 3 + Math.random()*7;
   smoke.push({
     x:canvas.width/2,
     y:canvas.height/2,
     size:25+Math.random()*40,
     alpha:1,
     vx:Math.cos(a)*sp,
     vy:Math.sin(a)*sp
   });
 }

 setTimeout(()=>{
   segmenter.send({image:video});
 },400);
}

// ===== ANIMATION =====
function animate(){
 const now = performance.now();
 dt = Math.min(0.05, (now - lastTime)/1000);
 lastTime = now;

 ctx.clearRect(0,0,canvas.width,canvas.height);

 // screen shake — เด้งจอตอนปุ๊ง
 let sx=0, sy=0;
 if(shakeTime>0){
   const k = shakeTime/shakeMax;
   sx = (Math.random()-0.5)*22*k;
   sy = (Math.random()-0.5)*22*k;
   shakeTime -= dt;
 }
 ctx.save();
 ctx.translate(sx, sy);

 if(frozenBackground){
   ctx.drawImage(frozenBackground,0,0);
 }

 // smoke — ใช้ pre-rendered sprite (เร็วกว่า arc+gradient หลายเท่า)
 for(let i=smoke.length-1;i>=0;i--){
   let p=smoke[i];
   p.x+=p.vx;
   p.y+=p.vy;
   p.vx*=0.96; p.vy*=0.96;
   p.alpha-=0.025;
   if(p.alpha<=0){ smoke.splice(i,1); continue; }
   ctx.globalAlpha = p.alpha;
   ctx.drawImage(smokeSprite, p.x-p.size, p.y-p.size, p.size*2, p.size*2);
 }
 ctx.globalAlpha = 1;

 if(mode==="split" && personImage){

   // ใช้เวลาแทน frame counter — สมูธทุก refresh rate (60/120/144Hz)
   revealProgress = Math.min(cloneCount, revealProgress + revealRate*dt);
   revealIndex = Math.floor(revealProgress);

   // ===== ด้านหลังลึก (ค่อยๆ จาง) =====
   for(let i=backCount;i>=1;i--){
     let scale=1-(i*0.08);
     let yOffset=i*40;

     ctx.save();
     ctx.translate(canvas.width/2,canvas.height/2+yOffset);
     ctx.scale(scale,scale);
     ctx.globalAlpha = 0.9 - i*0.18;
     ctx.drawImage(personImage,
       -canvas.width/2,
       -canvas.height/2,
       canvas.width,
       canvas.height);
     ctx.restore();
   }
   ctx.globalAlpha = 1;

   // ===== ซ้าย ขวา — pop-in แบบ easeOutBack ทำให้เด้งดูมีชีวิต =====
   const ceil = Math.ceil(revealProgress);
   for(let i=ceil;i>=1;i--){
     const local = Math.max(0, Math.min(1, revealProgress - (i-1)));
     // easeOutBack — overshoot นิดหน่อยเวลาโผล่
     const s = 1.70158;
     const t = local - 1;
     const ease = (t*t*((s+1)*t + s) + 1);
     const x = safeSpacing*i;

     // ซ้าย
     ctx.save();
     ctx.translate(canvas.width/2 - x, canvas.height/2);
     ctx.scale(ease, ease);
     ctx.globalAlpha = local;
     ctx.drawImage(personImage,
       -canvas.width/2, -canvas.height/2,
       canvas.width, canvas.height);
     ctx.restore();

     // ขวา
     ctx.save();
     ctx.translate(canvas.width/2 + x, canvas.height/2);
     ctx.scale(ease, ease);
     ctx.globalAlpha = local;
     ctx.drawImage(personImage,
       -canvas.width/2, -canvas.height/2,
       canvas.width, canvas.height);
     ctx.restore();
   }
   ctx.globalAlpha = 1;

   // ===== ตัวกลาง วาดสุดท้าย (อยู่บนสุด) =====
   ctx.drawImage(personImage,0,0,canvas.width,canvas.height);

    if(revealIndex>=cloneCount && !finished){
      finished=true;
      setTimeout(resetEffect, 4000);
    }
  }

  // อัปเดต fire particles (ลอยขึ้นต่อแม้มือออกแล้ว)
  updateFireParticles();

  ctx.restore(); // ปิด shake transform

  // flash overlay — อยู่บนสุดเสมอ ไม่ต้องโดน shake
  if(flashAlpha>0){
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    flashAlpha -= dt*2.5;
  }

  requestAnimationFrame(animate);
}
animate();

function resetEffect() {
  // สร้างควันระเบิดตอนหายตัว
  for(let i=0;i<50;i++){
    smoke.push({
      x: canvas.width/2 + (Math.random()-0.5)*canvas.width*0.6,
      y: canvas.height/2 + (Math.random()-0.5)*canvas.height*0.6,
      size: 30+Math.random()*40,
      alpha: 1,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.5)*10
    });
  }

  setTimeout(() => {
    mode="idle";
    frozenBackground=null;
    personImage=null;
    revealIndex=0;
    revealProgress=0;
    frameCounter=0;
    chakraCharge=0;
    finished=false; // เริ่มประมวลผลกล้องจับมือใหม่อีกครั้ง
  }, 200);
}

function updateLog(){
 logDiv.innerHTML=
 "JUTSU: "+JUTSU[currentJutsu].sub+"<br>"+
 "MODE: "+mode+"<br>"+
 "CHAKRA: "+(chakraCharge*100).toFixed(0)+"%<br>"+
 "FX: "+fireParticles.length;
}

async function loop(){
 if(!finished) {
   try {
     await hands.send({image:video});
   } catch(err) {
     console.error(err);
   }
 }
 requestAnimationFrame(loop);
}
video.addEventListener("loadeddata",loop);

// ===== Menu: เปลี่ยนท่าไม้ตาย =====
const titleEl = document.getElementById("title");
function setJutsu(name){
  if(!JUTSU[name] || name===currentJutsu) return;
  currentJutsu = name;
  const j = JUTSU[name];

  // อัปเดต UI
  document.querySelectorAll(".jutsu-card").forEach(b=>{
    b.classList.toggle("active", b.dataset.jutsu===name);
  });
  titleEl.innerHTML = `${j.title}<span class="jp">${j.sub}</span>`;
  titleEl.style.setProperty("--jutsu-color", j.glow);

  // รีเซ็ตสถานะที่ค้าง
  chakraCharge = 0;
  fireParticles = [];
  if(mode!=="idle"){
    // ถ้ากำลังเล่นโคลนอยู่ ให้รีเซ็ตกลับ idle
    mode = "idle";
    frozenBackground = null;
    personImage = null;
    revealIndex = 0;
    revealProgress = 0;
    finished = false;
  }
}
document.querySelectorAll(".jutsu-card").forEach(btn=>{
  btn.addEventListener("click", ()=> setJutsu(btn.dataset.jutsu));
});

// keyboard shortcut: 1-4
window.addEventListener("keydown", e=>{
  const map = {"1":"shadowClone","2":"chidori","3":"rasengan","4":"fireball"};
  if(map[e.key]) setJutsu(map[e.key]);
});

</script>
