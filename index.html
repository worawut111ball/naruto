<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clone Split Center Top</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
/* เพิ่มฟิลเตอร์เพื่อให้กล้องดูสดใส มีชีวิตชีวา สีผิวอมชมพูเหมือนอนิเมะ */
video, canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  filter: saturate(1.2) contrast(1.1) brightness(1.03);
  transition: filter 0.5s ease;
}
/* เอฟเฟกต์ Vignette เกรดภาพยนต์ เพิ่มมิติความลึกให้กล้อง */
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
  pointer-events: none;
  z-index: 5;
}
/* ดีไซน์ปุ่มแสดงสถานะให้ดูมินิมอล โมเดิร์น แบบกระจกฝ้า (Glassmorphism) */
#log {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #00ffaa;
  background: rgba(10, 15, 30, 0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 255, 170, 0.25);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  font-family: 'Fira Code', monospace;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  z-index: 20;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="log"></div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const logDiv=document.getElementById("log");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let mode="idle";
let frozenBackground=null;
let personImage=null;
let smoke=[];
let finished=false;

let cloneCount=7;     // ต่อข้าง
let backCount=3;      // ด้านหลัง
let revealIndex=0;
let revealSpeed=4;
let frameCounter=0;
let safeSpacing=60;

// ดึงข้อมูลกล้องแบบ High-Definition (HD) เพื่อความคมชัดสูงสุด
navigator.mediaDevices.getUserMedia({
  video: {
    width: { ideal: 1920 },
    height: { ideal: 1080 },
    facingMode: "user"
  }
})
.then(s=>video.srcObject=s)
.catch(err=>console.error("Camera access error: ", err));

// ===== HANDS =====
const hands=new Hands({
 locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
 maxNumHands:2,
 modelComplexity:0,
 minDetectionConfidence:0.7,
 minTrackingConfidence:0.7
});

hands.onResults(res=>{

 if(mode==="idle"){
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
 }

  if(res.multiHandLandmarks && mode==="idle"){
    ctx.save();
    // สร้างเอฟเฟกต์เรืองแสงจักระสีฟ้าเทอร์ควอยซ์แบบในการ์ตูน
    ctx.shadowColor = "#00f0ff";
    ctx.shadowBlur = 15;
    for(const landmarks of res.multiHandLandmarks){
      drawConnectors(ctx,landmarks,HAND_CONNECTIONS,
        {color:"rgba(0, 240, 255, 0.85)",lineWidth:3});
      drawLandmarks(ctx,landmarks,
        {color:"#ff6600",lineWidth:2});
    }
    ctx.restore();

    if(res.multiHandLandmarks.length===2){
      const h1=res.multiHandLandmarks[0][8];
      const h2=res.multiHandLandmarks[1][8];
      const dx=h1.x-h2.x;
      const dy=h1.y-h2.y;
      const dist=Math.sqrt(dx*dx+dy*dy);

      if(dist<0.05){
        triggerCapture();
      }
    }
  }
 }

 updateLog();
});

// ===== SEGMENT =====
const segmenter=new SelfieSegmentation({
 locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
});
segmenter.setOptions({modelSelection:1});

segmenter.onResults(results=>{

 if(mode!=="capture") return;

 frozenBackground=document.createElement("canvas");
 frozenBackground.width=canvas.width;
 frozenBackground.height=canvas.height;
 frozenBackground.getContext("2d")
  .drawImage(video,0,0,canvas.width,canvas.height);

 const maskCanvas=document.createElement("canvas");
 maskCanvas.width=canvas.width;
 maskCanvas.height=canvas.height;
 maskCanvas.getContext("2d")
  .drawImage(results.segmentationMask,
    0,0,canvas.width,canvas.height);

 const temp=document.createElement("canvas");
 temp.width=canvas.width;
 temp.height=canvas.height;
 const t=temp.getContext("2d");

 t.drawImage(video,0,0,temp.width,temp.height);
 t.globalCompositeOperation="destination-in";
 t.drawImage(maskCanvas,0,0,temp.width,temp.height);

 personImage=temp;

 safeSpacing=(canvas.width/2)/(cloneCount+1);

 mode="split";
});

// ===== TRIGGER =====
function triggerCapture(){

 if(finished) return;

 mode="capture";

 for(let i=0;i<50;i++){
   smoke.push({
     x:canvas.width/2,
     y:canvas.height/2,
     size:20+Math.random()*30,
     alpha:1,
     vx:(Math.random()-0.5)*6,
     vy:(Math.random()-0.5)*6
   });
 }

 setTimeout(()=>{
   segmenter.send({image:video});
 },400);
}

// ===== ANIMATION =====
function animate(){

 ctx.clearRect(0,0,canvas.width,canvas.height);

 if(frozenBackground){
   ctx.drawImage(frozenBackground,0,0);
 }

 // smoke
 for(let i=smoke.length-1;i>=0;i--){
   let p=smoke[i];
   p.x+=p.vx;
   p.y+=p.vy;
   p.alpha-=0.03;

   ctx.beginPath();
   ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
   ctx.fillStyle="rgba(200,200,200,"+p.alpha+")";
   ctx.fill();

   if(p.alpha<=0) smoke.splice(i,1);
 }

 if(mode==="split" && personImage){

   frameCounter++;

   if(frameCounter % revealSpeed===0 &&
      revealIndex<cloneCount){
      revealIndex++;
   }

   // ===== ด้านหลังลึก =====
   for(let i=backCount;i>=1;i--){
     let scale=1-(i*0.08);
     let yOffset=i*40;

     ctx.save();
     ctx.translate(canvas.width/2,canvas.height/2+yOffset);
     ctx.scale(scale,scale);
     ctx.drawImage(personImage,
       -canvas.width/2,
       -canvas.height/2,
       canvas.width,
       canvas.height);
     ctx.restore();
   }

   // ===== ซ้าย ขวา (วาดก่อน เพื่อให้อยู่หลังตัวกลาง) =====
   for(let i=revealIndex;i>=1;i--){
     let x=safeSpacing*i;

     ctx.drawImage(personImage,
       -x,0,
       canvas.width,canvas.height);

     ctx.drawImage(personImage,
       x,0,
       canvas.width,canvas.height);
   }

   // ===== ตัวกลาง วาดสุดท้าย (อยู่บนสุด) =====
   ctx.drawImage(personImage,0,0,
     canvas.width,canvas.height);

    if(revealIndex>=cloneCount && !finished){
      finished=true;
      setTimeout(resetEffect, 5000);
    }
  }

  requestAnimationFrame(animate);
}
animate();

function resetEffect() {
  // สร้างควันระเบิดตอนหายตัว
  for(let i=0;i<50;i++){
    smoke.push({
      x: canvas.width/2 + (Math.random()-0.5)*canvas.width*0.6,
      y: canvas.height/2 + (Math.random()-0.5)*canvas.height*0.6,
      size: 30+Math.random()*40,
      alpha: 1,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.5)*10
    });
  }

  setTimeout(() => {
    mode="idle";
    frozenBackground=null;
    personImage=null;
    revealIndex=0;
    frameCounter=0;
    finished=false; // เริ่มประมวลผลกล้องจับมือใหม่อีกครั้ง
  }, 200);
}

function updateLog(){
 logDiv.innerHTML=
 "MODE: "+mode+"<br>"+
 "REVEAL: "+revealIndex+"/"+cloneCount+"<br>"+
 "SMOKE: "+smoke.length+"<br>"+
 "SPACING: "+safeSpacing.toFixed(1);
}

async function loop(){
 if(!finished) {
   try {
     await hands.send({image:video});
   } catch(err) {
     console.error(err);
   }
 }
 requestAnimationFrame(loop);
}
video.addEventListener("loadeddata",loop);

</script>
</body>
</html>
